<!-- LIGHTBOX -->
<div id="lightbox" class="lightbox">
    <span class="close-btn">&times;</span>
    <span class="prev-btn">&#10094;</span>
    <img id="lightbox-img" src="">
    <span class="next-btn">&#10095;</span>
</div>

<script src="js/script.js"></script>

<!-- JS ESPECÍFICO DEL LIGHTBOX -->
<script>
    const images = document.querySelectorAll(".grid-galeria img");
    const lightbox = document.getElementById("lightbox");
    const lightboxImg = document.getElementById("lightbox-img");
    const closeBtn = document.querySelector(".close-btn");
    const nextBtn = document.querySelector(".next-btn");
    const prevBtn = document.querySelector(".prev-btn");

    let currentIndex = 0;

    images.forEach((img, index) => {
        img.addEventListener("click", () => {
            currentIndex = index;
            showImage();
            lightbox.style.display = "flex";
        });
    });

    function showImage() {
        lightboxImg.src = images[currentIndex].src;
        scale = 1;
        imgX = 0;
        imgY = 0;
        lightboxImg.style.transform = "scale(1)";
    }

    closeBtn.addEventListener("click", () => {
        lightbox.style.display = "none";
    });

    nextBtn.addEventListener("click", () => {
        currentIndex = (currentIndex + 1) % images.length;
        showImage();
    });

    prevBtn.addEventListener("click", () => {
        currentIndex = (currentIndex - 1 + images.length) % images.length;
        showImage();
    });

    lightbox.addEventListener("click", (e) => {
        if (e.target === lightbox) {
            lightbox.style.display = "none";
        }
    });

    // ZOOM + DRAG + PINCH
    let scale = 1;
    let isDragging = false;
    let startX, startY;
    let imgX = 0, imgY = 0;

    lightboxImg.addEventListener("wheel", (e) => {
        e.preventDefault();
        const zoomSpeed = 0.1;

        if (e.deltaY < 0) {
            scale += zoomSpeed;
        } else {
            scale = Math.max(1, scale - zoomSpeed);
        }

        lightboxImg.style.transform = `scale(${scale}) translate(${imgX}px, ${imgY}px)`;
    });

    lightboxImg.addEventListener("mousedown", (e) => {
        if (scale <= 1) return;
        isDragging = true;
        startX = e.clientX - imgX;
        startY = e.clientY - imgY;
    });

    lightboxImg.addEventListener("mousemove", (e) => {
        if (!isDragging) return;
        imgX = e.clientX - startX;
        imgY = e.clientY - startY;
        lightboxImg.style.transform = `scale(${scale}) translate(${imgX}px, ${imgY}px)`;
    });

    lightboxImg.addEventListener("mouseup", () => {
        isDragging = false;
    });

    lightboxImg.addEventListener("mouseleave", () => {
        isDragging = false;
    });

    let initialDistance = 0;

    lightboxImg.addEventListener("touchstart", (e) => {
        if (e.touches.length === 2) {
            const dx = e.touches[0].clientX - e.touches[1].clientX;
            const dy = e.touches[0].clientY - e.touches[1].clientY;
            initialDistance = Math.sqrt(dx * dx + dy * dy);
        }
    });

    lightboxImg.addEventListener("touchmove", (e) => {
        if (e.touches.length === 2) {
            e.preventDefault();
            const dx = e.touches[0].clientX - e.touches[1].clientX;
            const dy = e.touches[0].clientY - e.touches[1].clientY;
            const newDistance = Math.sqrt(dx * dx + dy * dy);

            const zoomFactor = newDistance / initialDistance;
            scale = Math.min(Math.max(1, zoomFactor), 4);

            lightboxImg.style.transform = `scale(${scale}) translate(${imgX}px, ${imgY}px)`;
        }
    });
</script>
